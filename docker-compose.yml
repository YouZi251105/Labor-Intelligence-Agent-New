name: labor-intelligence-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labor_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-labor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labor_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labor} -d ${POSTGRES_DB:-labor_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-labor-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-labor_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-labor}:${POSTGRES_PASSWORD:-labor_dev_password}@db:5432/${POSTGRES_DB:-labor_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-labor-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-labor_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-labor-evidence}
      STORAGE_BACKEND: s3
      TASK_BACKEND: celery
      TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      ENABLE_METRICS: "true"
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-labor}:${POSTGRES_PASSWORD:-labor_dev_password}@db:5432/${POSTGRES_DB:-labor_intelligence}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-labor-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-labor_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-labor-evidence}
      STORAGE_BACKEND: s3
      TASK_BACKEND: celery
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
