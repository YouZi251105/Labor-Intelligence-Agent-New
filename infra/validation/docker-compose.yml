name: labor-stage4-validation

services:
  db:
    image: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: labor_validation
      POSTGRES_USER: labor_validation
      POSTGRES_PASSWORD: ${VALIDATION_DB_PASSWORD:-labor_validation_password}
    volumes:
      - postgres-validation-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U labor_validation -d labor_validation",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/library/redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-validation-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VALIDATION_MINIO_USER:-labor_validation}
      MINIO_ROOT_PASSWORD: ${VALIDATION_MINIO_PASSWORD:-labor_validation_password}
    volumes:
      - minio-validation-data:/data

  backend:
    build:
      context: ../../backend
      args:
        PYTHON_BASE_IMAGE: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/library/python:3.13-slim
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    environment:
      APP_ENV: validation
      APP_DEBUG: "false"
      SECRET_KEY: ${VALIDATION_SECRET_KEY:-stage4-validation-only-secret}
      DATABASE_URL: postgresql+asyncpg://labor_validation:${VALIDATION_DB_PASSWORD:-labor_validation_password}@db:5432/labor_validation
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      TASK_BACKEND: celery
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${VALIDATION_MINIO_USER:-labor_validation}
      MINIO_SECRET_KEY: ${VALIDATION_MINIO_PASSWORD:-labor_validation_password}
      MINIO_BUCKET: labor-validation-evidence
      MINIO_SECURE: "false"
      DEMO_SEED: "true"
      TRUSTED_HOSTS: '["*"]'
      RATE_LIMIT_PER_MINUTE: "300"
      ENABLE_METRICS: "true"
      CORS_ORIGINS: '["http://127.0.0.1:${VALIDATION_PUBLIC_PORT:-18080}"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../../backend
      args:
        PYTHON_BASE_IMAGE: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/library/python:3.13-slim
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      APP_ENV: validation
      SECRET_KEY: ${VALIDATION_SECRET_KEY:-stage4-validation-only-secret}
      DATABASE_URL: postgresql+asyncpg://labor_validation:${VALIDATION_DB_PASSWORD:-labor_validation_password}@db:5432/labor_validation
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      TASK_BACKEND: celery
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${VALIDATION_MINIO_USER:-labor_validation}
      MINIO_SECRET_KEY: ${VALIDATION_MINIO_PASSWORD:-labor_validation_password}
      MINIO_BUCKET: labor-validation-evidence
      MINIO_SECURE: "false"
      DEMO_SEED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/library/node:24-alpine
        NGINX_BASE_IMAGE: ${VALIDATION_REGISTRY:-mirror.ccs.tencentyun.com}/library/nginx:1.29-alpine
        NPM_REGISTRY: https://registry.npmmirror.com
    ports:
      - "${VALIDATION_PUBLIC_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-validation-data:
  redis-validation-data:
  minio-validation-data:
